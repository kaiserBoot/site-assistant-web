<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>支援 - 案件助手 Site Assistant</title>
<script>
  // 做法與 privacy/index.html、terms/index.html 完全一致，見那些檔案內的註解
  // （只有明確的繁體中文變體 zh-Hant／zh-TW／zh-HK／zh-MO 才導向 zh-hant/，
  // 簡體中文與其餘語言 fallback 英文）。
  (function () {
    var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
    var isZhHant =
      lang === 'zh-hant' || lang.indexOf('zh-hant-') === 0 ||
      lang === 'zh-tw' || lang.indexOf('zh-tw-') === 0 ||
      lang === 'zh-hk' || lang.indexOf('zh-hk-') === 0 ||
      lang === 'zh-mo' || lang.indexOf('zh-mo-') === 0;
    var isJa = lang === 'ja' || lang.indexOf('ja-') === 0;
    var target = isZhHant ? './zh-hant/' : (isJa ? './ja/' : './en/');
    location.replace(target);
  })();
</script>
</head>
<body>
<p>Redirecting to your language / 正在導向對應語系頁面…</p>
<p><a href="./zh-hant/">繁體中文</a> · <a href="./en/">English</a> · <a href="./ja/">日本語</a></p>
</body>
</html>
